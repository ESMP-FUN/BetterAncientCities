name: BetterAncientCities
version: '${version}'
main: com.esmpfun.betterancientcities.BetterAncientCities
api-version: '1.21'
folia-supported: true
authors: [darkstarworks]
description: Makes Ancient Cities reusable on multiplayer servers. Every player gets their own chest loot, loot refreshes on a timer, and the city is protected from griefing.
website: https://github.com/ESMP-FUN/BetterAncientCities

commands:
  ancient:
    description: Manage Ancient Cities
    usage: /ancient <subcommand>
    aliases: [bac, acp, ancientcity, betterancientcities]
    permission: bac.admin

permissions:
  bac.admin:
    description: Use /ancient and the menu
    default: op
  bac.discovery.notify:
    description: Get a chat message when a new Ancient City is found
    default: op
  bac.bypass.protection:
    description: Break and place blocks in protected Ancient Cities
    default: op

  # Names from before 2.0. They only grant the new permission.
  acp.admin:
    description: Old name for bac.admin
    default: false
    children:
      bac.admin: true
  acp.discovery.notify:
    description: Old name for bac.discovery.notify
    default: false
    children:
      bac.discovery.notify: true
  acp.bypass.protection:
    description: Old name for bac.bypass.protection
    default: false
    children:
      bac.bypass.protection: true
